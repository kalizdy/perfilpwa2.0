<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil — abriendo…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, "Segoe UI", Arial, sans-serif;
      background: #0b1220;
      color: #e8eef9;
      text-align: center;
      padding: 20px;
    }

    a {
      color: #67e8f9;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <p>Abriendo el perfil… <a href="./fase-ui-pwa/">Entrar</a></p>

  <script>
    // Limpia el service worker y cachés de la versión anterior (raíz)
    // y luego abre la PWA que vive en /fase-ui-pwa/.
    (async function () {
      try {
        var raiz = new URL("./", location.href).href;

        var registros = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registros
          .filter(function (registro) { return registro.scope === raiz; })
          .map(function (registro) { return registro.unregister(); }));

        var nombres = await caches.keys();
        await Promise.all(nombres
          .filter(function (nombre) { return nombre.indexOf("perfil-pwa-v") === 0 && nombre !== "perfil-pwa-v6"; })
          .map(function (nombre) { return caches.delete(nombre); }));
      } catch (error) {
        /* sin soporte de SW/caché: igual redirige */
      }

      location.replace("./fase-ui-pwa/");
    })();
  </script>
</body>
</html>
